server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Kept in step with public/_headers, which is what Cloudflare serves.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; frame-src blob:; object-src blob:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

    # The whole app is static; PDFs are built in the browser and never uploaded.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cloudflare consumes this as configuration; nginx would just serve it.
    location = /_headers {
        return 404;
    }

    # Hashed filenames, so these are safe to cache hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
